services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduguard-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: eduguard-frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduguard-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
